<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bengaluru Lake Command Center</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="map"></div>

    <div id="master-control-panel" class="control-panel">
      <h2>BENGALURU CITY</h2>
      <p>Status: <span id="satellite-status">Waiting for Data Sync</span></p>
      <button id="global-link-btn" class="btn-primary" onclick="establishGlobalLink()">
        ACQUIRE SATELLITE LINK
      </button>
    </div>

    <div id="dashboardPanel" class="dashboard-panel">
      <button class="close-btn" onclick="closePanel()">&times;</button>

      <h1 id="lakeName">Lake Selector</h1>
      <div class="subtitle">Command Center v1.0</div>

      <div id="statusBadge" class="status-badge">Standby</div>

      <div id="insightBox" class="insight-box">
        <span style="color: #e94560; font-weight: bold">Insight:</span>
        <span id="conclusionText">Awaiting command...</span>
      </div>

      <div class="data-header">
        <span>Parameter</span>
        <span>Detected</span>
        <span>Normal</span>
      </div>

      <div class="data-row">
        <span class="label">Water Area</span>
        <span id="area" class="value">---</span>
        <span class="standard">Dynamic</span>
      </div>
      <div class="data-row">
        <span class="label">Surface Temp</span>
        <span id="lst" class="value" style="color: #e67e22">---</span>
        <span class="standard">&lt; 27°C</span>
      </div>
      <div class="data-row">
        <span class="label">Turbidity (NDTI)</span>
        <span id="ndti" class="value">---</span>
        <span class="standard">&lt; 0.1</span>
      </div>
      <div class="data-row">
        <span class="label">Chlorophyll Conc.</span>
        <span id="ndci" class="value">---</span>
        <span class="standard">&lt; 0.1</span>
      </div>
      <div class="data-row" style="border-bottom: none">
        <span class="label">Algal Bloom</span>
        <span id="mci" class="value">---</span>
        <span class="standard">&lt; 0.05</span>
      </div>

      <button onclick="fetchAnalysis()" id="analyzeBtn" style="display: none">
        Initialize Scan
      </button>
      <button onclick="downloadOfficialReport()" id="downloadBtn" class="btn-primary" style="display: none; background-color: #2980b9; margin-top: 15px; width: 100%;">
        Download Report
      </button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let satelliteLinked = false;
      // --- 1. INITIALIZE MAP ---
      var bounds = [
        [12.834012, 77.460102],
        [13.143664, 77.784143],
      ];

      var map = L.map("map", {
        maxBounds: bounds,
        minZoom: 11,
        zoomControl: false,
      }).setView([12.98, 77.6], 12);

      var legend = L.control({ position: "bottomright" });

      legend.onAdd = function (map) {
        var div = L.DomUtil.create("div", "legend");

        div.innerHTML +=
          '<h4 style="margin: 0 0 10px 0; font-family: Arial; font-size: 14px; text-transform: uppercase; border-bottom: 1px solid #ccc; padding-bottom: 5px;">Map Legend</h4>';

        // 1. NDCI Colorbar (As requested: 0 to 0.5 Red-Green)
        div.innerHTML +=
          '<b style="font-size: 12px;">NDCI (Algal Bloom Risk)</b><br>';
        div.innerHTML +=
          '<div style="background: linear-gradient(to right, red, #f1c40f, green); width: 100%; height: 12px; border-radius: 4px; margin: 5px 0; border: 1px solid #999;"></div>';
        div.innerHTML +=
          '<div style="display:flex; justify-content:space-between; font-size:10px; margin-bottom:12px; color: #555;"><span>0.0 (High)</span><span>0.5 (Safe)</span></div>';

        // 2. LST Colorbar (As requested: 20 to 40°C Blue-Red)
        div.innerHTML +=
          '<b style="font-size: 12px;">LST (Surface Temperature)</b><br>';
        div.innerHTML +=
          '<div style="background: linear-gradient(to right, #3498db, #f1c40f, #e74c3c); width: 100%; height: 12px; border-radius: 4px; margin: 5px 0; border: 1px solid #999;"></div>';
        div.innerHTML +=
          '<div style="display:flex; justify-content:space-between; font-size:10px; margin-bottom:12px; color: #555;"><span>20°C (Normal)</span><span>40°C (Anomaly)</span></div>';

        // 3. Water Body Marker
        var itemStyle =
          "display: flex; align-items: center; margin-bottom: 5px;";
        var boxStyle =
          "width: 14px; height: 14px; margin-right: 8px; border-radius: 3px; display: inline-block; background: #007bff; border: 1px solid #0056b3;";
        div.innerHTML += `<div style="${itemStyle}">
                                <span style="${boxStyle}"></span>
                                <span style="font-family: Arial; font-size: 12px;">Water Body Mask</span>
                              </div>`;

        div.innerHTML +=
          '<hr style="margin: 10px 0 5px 0;"><small style="font-family: Arial; color: #888;"><i>Live API Data Feed</i></small>';

        return div;
      };

      legend.addTo(map);

      L.control.zoom({ position: "bottomright" }).addTo(map);

      // CHANGED TO LIGHT MODE FOR BETTER VISIBILITY
      L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
        {
          attribution: "&copy; CARTO",
          maxZoom: 19,
        },
      ).addTo(map);

     const lakes = [
  { name: "Hebbal Lake", lat: 13.0466, lng: 77.5856, id: "hebbal", active: true },
  { name: "Bellandur Lake", lat: 12.9360, lng: 77.6660, id: "bellandur", active: true },
  { name: "Ulsoor Lake", lat: 12.9832, lng: 77.6200, id: "ulsoor", active: true },
  { name: "Sankey Tank", lat: 13.0093, lng: 77.5741, id: "sankey", active: true },
  { name: "Varthur Lake", lat: 12.9463, lng: 77.7345, id: "varthur", active: true }, 
  { name: "Madiwala Lake", lat: 12.9090, lng: 77.6185, id: "madiwala", active: true }, 
  { name: "Jakkur Lake", lat: 13.0850, lng: 77.6113, id: "jakkur", active: true }, 
  { name: "Agara Lake", lat: 12.9212, lng: 77.6412 , id: "agara", active: true }, 
  { name: "Yelahanka Lake", lat: 13.1108, lng: 77.5952, id: "yelahanka", active: true }, 
  { name: "Nagavara Lake", lat: 13.045, lng: 77.609 , id: "nagavara", active: true }, 
];

      let currentLakeId = "hebbal"; // Variable to remember which lake we clicked
      let buttonTimer = null;

      // --- 3. HANDLE INTERACTIONS ---
      const panel = document.getElementById("dashboardPanel");

      function closePanel() {
        panel.classList.remove("panel-visible");
      }

      lakes.forEach((lake) => {
        var marker = L.marker([lake.lat, lake.lng]).addTo(map);

        marker.bindTooltip(lake.name, {
          permanent: false,
          direction: "top",
        });

        marker.on("click", function () {
          // 1. Stop the 5-second timer if we click a new lake
          if (buttonTimer) {
             clearTimeout(buttonTimer);
          }

          panel.classList.add("panel-visible");
          document.getElementById("lakeName").textContent = lake.name;
          currentLakeId = lake.id;

          // 2. The Smart Lock: Check if data is downloaded before enabling the button
          const aBtn = document.getElementById("analyzeBtn");
          if (!satelliteLinked) {
              aBtn.innerHTML = " Awaiting Satellite Link";
              aBtn.disabled = true;
              aBtn.style.opacity = "0.5"; // Grays out the button
              aBtn.style.cursor = "not-allowed";
          } else {
              aBtn.innerHTML = "Initialize Scan";
              aBtn.disabled = false;
              aBtn.style.opacity = "1.0";
              aBtn.style.cursor = "pointer";
          }

          // 3. Reset text to "---" AND reset color to safe white
          const safeColor = "#ecf0f1";
          
          const areaEl = document.getElementById("area");
          areaEl.textContent = "---";
          areaEl.style.color = safeColor;
          
          const lstEl = document.getElementById("lst");
          lstEl.textContent = "---";
          lstEl.style.color = safeColor;
          
          const ndtiEl = document.getElementById("ndti");
          ndtiEl.textContent = "---";
          ndtiEl.style.color = safeColor;
          
          const ndciEl = document.getElementById("ndci");
          ndciEl.textContent = "---";
          ndciEl.style.color = safeColor;
          
          const mciEl = document.getElementById("mci");
          mciEl.textContent = "---";
          mciEl.style.color = safeColor;

          document.getElementById("downloadBtn").style.display = "none";

          if (lake.active) {
            document.getElementById("statusBadge").textContent = "WATER BODY SELECTED";
            document.getElementById("statusBadge").style.backgroundColor = "#2980b9";
            
            // --- SMART LOCK INSIGHT TEXT ---
            if (!satelliteLinked) {
                document.getElementById("conclusionText").textContent = "System locked. Please acquire the global satellite link to download telemetry data.";
            } else {
                document.getElementById("conclusionText").textContent = "Ready to process latest satellite imagery.";
            }
            
            document.getElementById("insightBox").style.display = "block";
            document.getElementById("analyzeBtn").style.display = "block";
          } else {
            document.getElementById("statusBadge").textContent = "OFFLINE";
            document.getElementById("statusBadge").style.backgroundColor = "#95a5a6";
            document.getElementById("conclusionText").textContent = "Data currently unavailable for this water body.";
            document.getElementById("insightBox").style.display = "block";
            document.getElementById("analyzeBtn").style.display = "none";
          }

          map.flyTo([lake.lat, lake.lng], 14, { duration: 1.5 });
        });
      });
      // BUTTON 2: INITIALIZE SCAN
      async function fetchAnalysis() {
        const btn = document.querySelector("#analyzeBtn");
        const badge = document.getElementById("statusBadge");

        btn.innerHTML = "🔄 Processing...";
        btn.disabled = true;

        try {
          const response = await fetch(
            "http://127.0.0.1:8000/analyze/" + currentLakeId,
          );
          const data = await response.json();

          if (data.error) {
            badge.textContent = "ERROR";
            badge.style.backgroundColor = "#e74c3c";
            alert("Analysis Failed: " + data.error);
          } else {
          
            // Define standard and warning colors
            const safeColor = "#ecf0f1"; // Standard dashboard white/gray
            const dangerColor = "#e74c3c"; // Warning Red
            
            // Area
            const areaEl = document.getElementById("area");
            areaEl.textContent = data.area_hectares + " Ha";
            areaEl.style.color = data.area_hectares < 10.0 ? dangerColor : safeColor;

            // Temperature (LST)
            const lstEl = document.getElementById("lst");
            lstEl.textContent = data.avg_lst + " °C";
            lstEl.style.color = data.avg_lst > 30.0 ? dangerColor : safeColor;

            // Turbidity (NDTI)
            const ndtiEl = document.getElementById("ndti");
            ndtiEl.textContent = data.avg_ndti;
            ndtiEl.style.color = data.avg_ndti > 0.05 ? dangerColor : safeColor;

            // Chlorophyll (NDCI)
            const ndciEl = document.getElementById("ndci");
            ndciEl.textContent = data.avg_ndci;
            ndciEl.style.color = data.avg_ndci > 0.08 ? dangerColor : safeColor;

            // Algal Bloom (MCI)
            const mciEl = document.getElementById("mci");
            mciEl.textContent = data.avg_mci;
            mciEl.style.color = data.avg_mci > 0.005 ? dangerColor : safeColor;

            badge.textContent = data.status.toUpperCase();

            let color = "#95a5a6";
            if (data.status === "Clear") color = "#27ae60";
            else if (data.status.includes("High")) color = "#e74c3c";
            else color = "#f1c40f";

            badge.style.backgroundColor = color;
            document.getElementById("conclusionText").innerHTML =
              data.conclusion;

            window.currentScanData = data; // Save the live data so the PDF can use it
            document.getElementById("downloadBtn").style.display = "block"; // Make the button visible!  

            btn.innerHTML = "✅ SCAN COMPLETE";
            buttonTimer = setTimeout(() => {
              btn.innerHTML = "Re-Initialize Scan";
              btn.disabled = false;
            }, 5000);
          }
        } catch (error) {
          console.error(error);
          btn.innerHTML = "❌ Error";
          btn.disabled = false;
        }
      }

      async function establishGlobalLink() {
        const btn = document.getElementById('global-link-btn');
        const status = document.getElementById('satellite-status');

        // UI change to show processing
        btn.innerText = "DOWNLOADING...";
        btn.style.backgroundColor = "#cbd5e0"; 
        btn.style.color = "#1a202c";
        status.innerText = "Establishing uplink...";

        try {
            // Create an array of simultaneous download requests for all active lakes
            const downloadPromises = lakes.filter(l => l.active).map(lake => {
                return fetch("http://127.0.0.1:8000/update-satellite-data/" + lake.id)
                    .then(response => response.json())
                    .then(data => {
                        if(data.status !== "success") {
                            console.error("Failed to download data for " + lake.name);
                        }
                    });
            });

            // Fire them ALL at the exact same time
            await Promise.all(downloadPromises);

            // Once the downloads finish, update global status
            satelliteLinked = true;
            
            btn.innerText = "DATA SYNCED";
            btn.style.backgroundColor = "#38a169"; 
            btn.style.color = "white";
            
            status.innerText = "System Online";
            status.style.color = "#38a169";

            // If a lake panel is currently open, instantly unlock its Analyze button!
            const aBtn = document.getElementById("analyzeBtn");
            if (aBtn && aBtn.disabled && currentLakeId) {
                aBtn.innerHTML = "Initialize Scan";
                aBtn.disabled = false;
                aBtn.style.opacity = "1.0";
                aBtn.style.cursor = "pointer";
            }

            alert("City-wide satellite data successfully downloaded! You can now analyze the lakes.");

        } catch (error) {
            console.error(error);
            btn.innerText = "CONNECTION FAILED";
            status.innerText = "Backend Offline";
            status.style.color = "#e53e3e";
        }
      }

      function downloadOfficialReport() {
        if (!window.currentScanData) return; 
        
        const d = window.currentScanData;
        
        // Encode the conclusion text so it doesn't break the web URL
        const safeConclusion = encodeURIComponent(d.conclusion);
        
        // Build the API link with all the live dashboard data
        const downloadUrl = `http://127.0.0.1:8000/api/download-report?lake_name=${d.lake_name}&area=${d.area_hectares}&ndci=${d.avg_ndci}&lst=${d.avg_lst}&ndti=${d.avg_ndti}&mci=${d.avg_mci}&status=${d.status}&conclusion=${safeConclusion}`;
        
        // Open the link in a new tab, triggering the PDF download!
        window.open(downloadUrl, "_blank");
      }

    </script>
  </body>
</html>
